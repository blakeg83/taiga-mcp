name: Build and test
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build --no-restore
      - run: pwsh -NoProfile -File scripts/validate-story-performance-finalization.ps1
      - run: pwsh -NoProfile -File .agents/skills/taiga-story-loop/scripts/validate-performance-interruptions.ps1
      - run: pwsh -NoProfile -File scripts/validate-story-performance-portability.ps1
      - run: pwsh -NoProfile -File scripts/validate-token-discovery.ps1
      - name: Package isolated portability fixture
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'portable-telemetry'
          New-Item -ItemType Directory -Path $fixture | Out-Null
          Copy-Item .agents/skills/taiga-story-loop -Destination $fixture -Recurse
          Copy-Item scripts/validate-story-performance-portability.ps1 -Destination $fixture
      - uses: actions/upload-artifact@v4
        with:
          name: portable-telemetry
          path: ${{ runner.temp }}/portable-telemetry
  standalone-telemetry:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      # Deliberately no checkout: the original source repository is unavailable.
      - uses: actions/download-artifact@v4
        with:
          name: portable-telemetry
          path: portable-telemetry
      - name: Exercise installed entry points without source checkout
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP ('taiga-portability-224-' + [guid]::NewGuid().ToString('N'))
          $installation = (Resolve-Path 'portable-telemetry/taiga-story-loop').Path
          try {
            & pwsh -NoProfile -NonInteractive -File ./portable-telemetry/validate-story-performance-portability.ps1 -InstalledSkillPath $installation -FixtureRoot $fixture
            if ($LASTEXITCODE -ne 0) { throw 'isolated portability regression failed' }
          }
          finally {
            $resolved = [IO.Path]::GetFullPath($fixture)
            if (-not $resolved.StartsWith([IO.Path]::GetFullPath($env:RUNNER_TEMP), [StringComparison]::OrdinalIgnoreCase) -or
                -not [IO.Path]::GetFileName($resolved).StartsWith('taiga-portability-224-')) { throw 'invalid fixture cleanup path' }
            if (Test-Path -LiteralPath $resolved) { Remove-Item -LiteralPath $resolved -Recurse -Force }
          }
